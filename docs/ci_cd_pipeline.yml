name: ML Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily retraining check at 2am UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: us-east-1

jobs:
  # ── 1. Code Quality ───────────────────────────────────────────────
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --ignore=tests/integration

      - name: Run regression suite
        run: pytest tests/eval/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ── 2. Model Evaluation Gate ──────────────────────────────────────
  model-evaluation:
    name: Model Quality Gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run model evaluation
        run: python -m src.evaluators.hallucination --threshold 0.85
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Check drift
        run: python -m src.monitoring.drift_detector --alert-on-drift
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ── 3. Build and Push Docker ──────────────────────────────────────
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: model-evaluation
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ml-service:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/ml-service:latest .
          docker push $ECR_REGISTRY/ml-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ml-service:latest

  # ── 4. Deploy to SageMaker ────────────────────────────────────────
  deploy:
    name: Deploy to AWS SageMaker
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy SageMaker endpoint
        run: |
          pip install boto3 sagemaker
          python scripts/deploy_sagemaker.py \
            --model-name fraud-detector \
            --image-tag ${{ github.sha }} \
            --instance-type ml.m5.xlarge

      - name: Smoke test endpoint
        run: python scripts/smoke_test.py --endpoint fraud-detector-endpoint

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Image: ${{ github.sha }}"
          echo "Timestamp: $(date -u)"
